---
#-----------   TRAINER -------------
# QAT Test Configuration
# Purpose: Test Quantization-Aware Training with 5 epochs
trainer:
  max_epochs: 10 # 5 normal + 5 QAT
  checkpoint:
  pretrain:
  batch_size: 32
  buffer_size: 400
  num_workers: 2
  data_type: float32
  gpu_type: "amd"
  train_loss: "bayesian_tv"

  # QAT Settings
  use_qat: true
  qat_start_epoch: 5 # Start QAT after 5 epochs of normal training

#----------  Parallelism -------------
parallelism:
  fsdp: 1
  simple_ddp: 8
  tensor_par: 1
  seq_par: 1

### Tiling
tiling:
  do_tiling: False
  div: 4
  overlap: 3

# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  lr: 2e-3
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 2
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 4
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 4
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

# ---------------------------- DATA -------------------------------------------
data:
  low_res_dir:
    {
      "ERA5_1": "/lustre/orion/lrn036/world-shared/data/superres/era5/5.625_deg/",
    }
  high_res_dir:
    {
      "ERA5_1": "/lustre/orion/lrn036/world-shared/data/superres/era5/1.40625_deg/",
    }

  spatial_resolution:
    { "ERA5_1": 625, "ERA5_2": 111, "PRISM": 18, "DAYMET_1": 18, "DAYMET_2": 4 }

  default_vars:
    [
      "land_sea_mask",
      "orography",
      "lattitude",
      "landcover",
      "2m_temperature",
      "2m_temperature_max",
      "2m_temperature_min",
      "temperature_200",
      "temperature_500",
      "temperature_850",
      "10m_u_component_of_wind",
      "u_component_of_wind_200",
      "u_component_of_wind_500",
      "u_component_of_wind_850",
      "10m_v_component_of_wind",
      "v_component_of_wind_200",
      "v_component_of_wind_500",
      "v_component_of_wind_850",
      "specific_humidity_200",
      "specific_humidity_500",
      "specific_humidity_850",
      "total_precipitation_24hr",
      "volumetric_soil_water_layer_1",
    ]

  dict_in_variables:
    {
      "ERA5_1":
        [
          "land_sea_mask",
          "orography",
          "lattitude",
          "landcover",
          "2m_temperature",
          "2m_temperature_max",
          "2m_temperature_min",
          "temperature_200",
          "temperature_500",
          "temperature_850",
          "10m_u_component_of_wind",
          "u_component_of_wind_200",
          "u_component_of_wind_500",
          "u_component_of_wind_850",
          "10m_v_component_of_wind",
          "v_component_of_wind_200",
          "v_component_of_wind_500",
          "v_component_of_wind_850",
          "specific_humidity_200",
          "specific_humidity_500",
          "specific_humidity_850",
          "total_precipitation_24hr",
