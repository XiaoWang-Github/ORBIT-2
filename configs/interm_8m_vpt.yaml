#-----------   TRAINER -------------
trainer:
  max_epochs: 50
  checkpoint: 
  pretrain: "/lustre/orion/lrn036/world-shared/xf9/downscale_checkpoint/intermediate_8m.ckpt"
  batch_size: 32
  buffer_size: 400
  num_workers: 2
  data_type: bfloat16
  train_loss: "bayesian_tv"

#----------  Parallelism -------------
parallelism:
  fsdp: 4
  simple_ddp: 4
  tensor_par: 1
  seq_par: 1

### Tiling
tiling:
  do_tiling: False
  div: 4
  overlap: 3

# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  # VPT specific parameters
  vpt:
    num_prompts: 10  # 可学习的 prompt tokens 数量
    prompt_dim: 256  # 与模型的 embed_dim 保持一致
    prompt_lr_multiplier: 10  # prompt 学习率相对于基础学习率的倍数
  # 基础学习率设置（用于 prompt）
  lr: 2e-4  # 降低基础学习率，因为 prompt 会乘以 multiplier
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 2
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 4
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 4
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

# ---------------------------- DATA -------------------------------------------
data:
  low_res_dir: {
    'ERA5_DAYMET': "/lustre/orion/lrn036/world-shared/kurihana/regridding/dataset/datasets/ERA5-Daymet-1dy-superres/15.0_arcmin",
  }
  high_res_dir: {
    'ERA5_DAYMET': "/lustre/orion/lrn036/world-shared/kurihana/regridding/dataset/datasets/ERA5-Daymet-1dy-superres/3.75_arcmin",
  }

  # input spatial resolution in km
  spatial_resolution: {
    'ERA5_DAYMET':  28,
  }

  default_vars: [
    "land_sea_mask",
    "orography",
    "lattitude",
    "landcover",
    "2m_temperature",
    "2m_temperature_max",
    "2m_temperature_min",
    "temperature_200",
    "temperature_500",
    "temperature_850",
    "10m_u_component_of_wind",
    "u_component_of_wind_200",
    "u_component_of_wind_500",
    "u_component_of_wind_850",
    "10m_v_component_of_wind",
    "v_component_of_wind_200",
    "v_component_of_wind_500",
    "v_component_of_wind_850",
    "specific_humidity_200",
    "specific_humidity_500",
    "specific_humidity_850",
    "total_precipitation_24hr",
    "volumetric_soil_water_layer_1",
  ]
  
  dict_in_variables: {
    'ERA5_DAYMET': [
      "land_sea_mask",
      "orography",
      "lattitude",
      "landcover",
      "total_precipitation_24hr",
      "2m_temperature_min",
      "2m_temperature_max",
    ],
  }

  dict_out_variables: {
    'ERA5_DAYMET': [
       "total_precipitation_24hr",
    ],
  }

  var_weights: {
    "2m_temperature": 10,
    "10m_u_component_of_wind": 1,
    "10m_v_component_of_wind": 1,
    "total_precipitation_24hr": 1,
    "2m_temperature_min": 10,
    "2m_temperature_max": 10,
  }