#-----------   TRAINER -------------
# Phase 0: Quick Baseline Experiment (5 epochs)
# Purpose: Validate convergence and establish baseline before QAT
trainer:
  max_epochs: 5  # Quick test - will extend based on results
  checkpoint: 
  pretrain:
  batch_size: 32
  buffer_size: 400
  num_workers: 2
  data_type: bfloat16
  gpu_type: "amd" #amd or nvidia
  train_loss: "bayesian_tv"

#----------  Parallelism -------------
parallelism:
  fsdp: 1
  simple_ddp: 8
  tensor_par: 1
  seq_par: 1


### Tiling
tiling:
  do_tiling: False
  div: 4
  overlap: 3
  
# ---------------------------- MODEL -------------------------------------------
model:
  preset: res_slimvit
  lr: 2e-3
  weight_decay: 1e-5
  beta_1: 0.9
  beta_2: 0.99
  warmup_epochs: 2
  warmup_start_lr: 1e-7
  eta_min: 1e-8
  superres_mag: 4
  cnn_ratio: 4
  patch_size: 2
  embed_dim: 256
  depth: 6
  decoder_depth: 4
  num_heads: 4
  mlp_ratio: 4
  drop_path: 0.1
  drop_rate: 0.1

